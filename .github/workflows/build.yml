name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev \
            fonts-wqy-microhei

      - name: Cache buildozer (Android SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install buildozer
        run: |
          pip install --user 'buildozer<2.0' cython==0.29.37
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Chinese font
        run: |
          python kivy_app/download_font.py
          # Make sure fonts directory exists
          mkdir -p kivy_app/fonts
          ls -la kivy_app/fonts/

      - name: Build APK with buildozer
        run: |
          # Run buildozer with verbose output
          buildozer --verbose android debug 2>&1
          echo "BUILD_EXIT_CODE=$?"

      - name: Check build result
        if: always()
        run: |
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "BUILD SUCCESS: APK found in bin/"
            ls -la bin/*.apk
          else
            echo "BUILD FAILED: No APK generated"
            echo "=== Checking buildozer logs ==="
            find .buildozer -name "*.log" 2>/dev/null | head -10
            for log in $(find .buildozer -name "*.log" 2>/dev/null); do
              echo "--- $log ---"
              tail -50 "$log"
            done
            echo "=== Checking buildozer state ==="
            cat .buildozer/state 2>/dev/null || echo "No state file"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackTranslate-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30