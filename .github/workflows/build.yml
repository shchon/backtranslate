name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Chinese font
        run: |
          apt-get update -qq
          apt-get install -y -qq fonts-wqy-microhei 2>/dev/null || true
          python3 kivy_app/download_font.py || true
          mkdir -p kivy_app/fonts
          ls -la kivy_app/fonts/ 2>/dev/null || echo "No fonts directory"

      - name: Build APK with buildozer
        run: |
          echo "y" | buildozer --verbose --user android debug 2>&1

      - name: Check build result
        if: always()
        run: |
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "BUILD SUCCESS: APK found in bin/"
            ls -la bin/*.apk
          else
            echo "BUILD FAILED: No APK generated"
            echo "=== Checking buildozer logs ==="
            find .buildozer -name "*.log" 2>/dev/null | head -10
            for log in $(find .buildozer -name "*.log" 2>/dev/null); do
              echo "--- $log ---"
              tail -50 "$log"
            done
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackTranslate-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30